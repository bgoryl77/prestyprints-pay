<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>Presty Prints | Pay</title>
<style>:root{--bg:#f6f7fb;--card:#fff;--ink:#111827;--muted:#667085;--line:#e5e7eb}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}.wrap{max-width:520px;margin:auto;padding:32px 18px 48px}.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px 20px;box-shadow:0 12px 40px rgba(17,24,39,.08)}.brand{text-align:center;margin-bottom:24px}.brand h1{margin:0;font-size:32px;letter-spacing:-1px}.brand p{color:var(--muted);margin:8px 0 0}.pay{display:block;width:100%;text-decoration:none;text-align:center;border-radius:16px;padding:17px 14px;margin:12px 0;font-size:18px;font-weight:750;border:1px solid var(--line);color:#fff}.cash{background:#00c244}.venmo{background:#008cff}.zelle{background:#6d1ed4}.facebook{background:#1877f2}.detail{display:block;font-size:13px;font-weight:550;opacity:.9;margin-top:3px}.divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px;margin:22px 0}.divider:before,.divider:after{content:"";height:1px;background:var(--line);flex:1}.note{text-align:center;color:var(--muted);font-size:13px;line-height:1.45;margin-top:20px}#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:999px;display:none;font-size:14px}</style></head>
<body><main class="wrap"><section class="card"><div class="brand"><h1>Presty Prints</h1><p>Choose your preferred payment method</p></div>
<a class="pay cash" href="https://cash.app/$prestyprints" rel="noopener">Cash App<span class="detail">$prestyprints</span></a>
<a class="pay venmo" href="https://venmo.com/u/bgoryl" rel="noopener">Venmo<span class="detail">@bgoryl</span></a>
<a class="pay zelle" href="#" onclick="copyZelle(event)">Zelle<span class="detail">704-340-8555 · tap to copy</span></a>
<div class="divider">FOLLOW US</div><a class="pay facebook" href="https://www.facebook.com/profile.php?id=61583484881085" rel="noopener">Facebook<span class="detail">Visit Presty Prints</span></a>
<p class="note">Please verify the recipient name before sending payment. Thank you for supporting Presty Prints.</p></section></main><div id="toast"></div>
<script>function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2200)}async function copyZelle(e){e.preventDefault();try{await navigator.clipboard.writeText('704-340-8555');toast('Zelle number copied')}catch(_){toast('Zelle: 704-340-8555')}}</script></body></html>
